<!-- Card Hover Effect -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Card Hover Effect</title>
        <link rel="stylesheet" href="22.2 Card Hover Effect.css">
    </head>
    <body>
        <h1>Hackathon Mentors</h1>
        <div class="card">
            <img src="22.3 Woman.png" alt="Shradha Khapra" class="profile">
            <span class="description">
                <h3>Shradha Khapra</h3>
                <p>Data Analyst @ Microsoft</p>
            </span>
            <img src="22.5 Microsoft.png" alt="Microsoft Logo" class="logo">
        </div>
        <div class="card">
            <img src="22.4 Man.png" alt="Aman Dhattarwal" class="profile">
            <span class="description">
                <h3>Aman Dhattarwal</h3>
                <p>Software Engineer @ Google</p>
            </span>
            <img src="22.6 Google.png" alt="Google Logo" class="logo">
        </div>
    </body>
</html>
