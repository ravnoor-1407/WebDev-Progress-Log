<!-- Display Property in CSS -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Display Property</title>
        <link rel="stylesheet" href="16.2 Display Property.css">
    </head>
    <body>
        <h1>Inline</h1>
        <h3 class="inline">Ravnoor</h3>
        <h3 class="inline">Kaur</h3>
        
        <h1>Block</h1>
        <span class="block">Ravnoor</span>
        <span class="block">Kaur</span>
        
        <h1>Inline-Block</h1>
        <div class="inline-block">Ravnoor </div>
        <div class="inline-block">Kaur</div>
    </body>
</html>
