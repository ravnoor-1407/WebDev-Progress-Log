<!-- Alerts Component in Bootstrap -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Alerts</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">    </head>
    <body>
        <div class="container">
            <!-- Basic alerts -->
            <div class="alert alert-primary">Redirecting to Result Portal...</div>
            <div class="alert alert-warning">Congratulations!! You got 9.56 CGPA</div>
            <!-- Additional content -->
            <div class="alert alert-success" role="alert">
                <h4 class="alert-heading">Well done!</h4>
                <p>Aww yeah, you finally got your desired result score.</p>
                <hr>
                <p class="mb-0">Keep going!! Keep achieving.</p>
            </div>
            <!-- Link alerts -->
             <div class="alert alert-info" role="alert">
                You can <a href="#" class="alert-link">download your grade sheet</a>. Go and save it.
            </div>
            <!-- Dismissable alerts -->
             <div class="alert alert-dark alert-dismissible fade show" role="alert">
                <strong>Grade sheet Downloaded!</strong> You should check in downloads folder.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
