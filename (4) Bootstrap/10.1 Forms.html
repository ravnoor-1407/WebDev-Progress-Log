<!-- Form Controls in Bootstrap -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Forms</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <div class="container">
            <h2>Bootstrap Form Demo</h2>
            <form>
                <!-- Layout: Here taken example if screen size greater than 768px both cover 50% each else 100% width -->
                <div class="row">
                    <div class="mb-3 col-md-6">
                        <label class="form-label" for="firstName">First Name</label>
                        <input type="text" class="form-control" placeholder="First Name" id="firstName">
                    </div>

                    <div class="mb-3 col-md-6">
                        <label class="form-label" for="lastName">Last Name</label>
                        <input type="text" class="form-control" placeholder="Last Name" id="lastName">
                    </div>
                </div>

                <!-- Form Controls -->
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" class="form-control" placeholder="Email" id="email">
                </div>

                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" placeholder="Password" id="password">
                </div>

                <div class="mb-3">
                    <label class="form-label" for="address">Address</label>
                    <input type="text" class="form-control-sm" placeholder="Address" id="address">
                </div>

                <!-- Select -->
                <div class="mb-3">
                    <select class="form-select">
                        <option selected>Choose your city</option>
                        <option value="1">Mumbai</option>
                        <option value="2">Delhi</option>
                        <option value="3">Hyderabad</option>
                    </select>
                </div>

                <!-- Checkbox Buttons -->
                <div class="mb-3 form-check">
                    <label class="form-check-label" for="agree">Agree</label>
                    <input class="form-check-input" type="checkbox" id="agree">
                </div>

                <!-- Radio Buttons -->
                <div class="mb-3 form-check">
                    <label class="form-check-label" for="radiobs">Yes/No</label>
                    <input class="form-check-input" type="radio" id="radiobs">
                </div>

                <!-- Switches -->
                <div class="mb-form-check form-switch">
                    <label class="form-check-label" for="switchCheckDefault">Default switch checkbox input</label>
                    <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault">                
                </div>
            </form>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
