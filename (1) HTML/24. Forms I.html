<!-- Forms in HTML - Part I -->
<!-- 
Forms are used to collect user input. 
They can contain various types of input elements such as text fields, checkboxes, radio buttons, and submit buttons. 
Forms are created using the <form> element, and each input element is defined within the form. 

Form Attributes:
(a)Action attribute is used to define what action needs to be performed when a form is submitted.
In simple terms, it specifies where to send the form data when the form is submitted.

(b)Method attribute is used to specify the HTTP method (GET or POST) to be used when submitting the form data.
GET method appends the form data to the URL, while POST method sends the form data in the body of the HTTP request, making it more secure for sensitive data.

Form Elements:
(a) Input element is used to create multiple form controls such as text fields, checkboxes, radio buttons, and submit buttons.
    There are various types of input elements that can be created using the type attribute.

(b) Type attribute is used to specify the type of input element to be created.
    Popular Type attributes:
    tupe ="text" creates a single-line text input field.
    type="password" creates a password input field that hides the characters entered by the user.
    type="number" creates a numeric input field that allows users to enter only numbers.
    type="checkbox" creates a checkbox input that allows users to select one or more options.
    type="radio" creates a radio button input that allows users to select only one option from a group of options.
    type="button" creates a clickable button that can be used to trigger a JavaScript function or submit the form.

(c) Placeholder attribute is used to provide a hint or example of the expected input in a form field.
    It is displayed inside the input field when it is empty and disappears when the user starts typing.

(d) Label element represents a caption for an item in a user interface. 
    It is used to provide a description or title for form controls such as input fields, checkboxes, and radio buttons.
    The label element is associated with a specific form control using the for attribute, which should match the id of the corresponding form control.

(e) Button element is used to create clickable buttons in a form that redirects to page where form data is processed. 
    It can be used to submit the form, reset the form, or trigger a JavaScript function when clicked.
    The type attribute of the button element can be set to:
    "submit" to submit the form
    "reset" to reset the form fields to their default values
    "button" to create a generic button that can be used for any purpose.

(f) Name attribute is used to specify the name of an input element. 
    It is important for form submission as it allows the server to identify and process the form data correctly. 
    When a form is submitted, the name attribute of each input element is included in the form data sent to the server, along with its corresponding value.

-->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Forms in HTML</title>
    </head>
    <body>
        <h1>Sign Up Form</h1>
        <form action="/server">
            <div>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>

            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button>Submit</button>
        </form>
    </body>
</html>
