<!-- Practice Questions on Forms-->
 <!DOCTYPE html>
 <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Practice Qs</title>
    </head>
    <body>
        <!--
        Recreate the following form with suitable elements and input types
        -->
        <h1>Registration Form</h1>
        <form action="/action">
            <div>
                <input type="text" placeholder="First Name" name="fname">
                <input type="text" placeholder="Last Name" name="lname">
            </div>    
            <div>
                <select name="gender" id="gender">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="others">Other</option>
                </select>
            </div>
            <div>
                Do you agree all the terms of service?
                <input type="checkbox" id="terms" name="agree">
                <label for="terms">Yes, I agree</label>
            </div>
            <button>Register</button>
        </form>
    </body>
 </html>
