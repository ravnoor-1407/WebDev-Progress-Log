<!-- Colspan & Rowspan Attributes in HTML Tables -->
<!--
Colspan and Rowspan are attributes used in HTML tables to specify how many columns or rows a cell should occupy across.
It is used to create cells which span over multiple columns or rows.
-->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Colspan & Rowspan Attributes</title>
    </head>
    <body>
        <table border = "black">
            <caption>Amazon Products</caption>
            <thead>
                <tr>
                    <th rowspan="2">Product Name</th>
                    <th colspan="2">Price</th>
                </tr>
                <tr>
                    <th>INR</th>
                    <th>USD</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Apple iPhone 17 Pro Max</td>
                    <td>₹1,29,900</td>
                    <td>$1,099</td>
                </tr>
                <tr>
                    <td>Samsung Galaxy S26 Ultra</td>
                    <td>₹1,19,999</td>
                    <td>$999</td>
                </tr>
                <tr>
                    <td>Mackbook Air M5</td>
                    <td>₹1,19,900</td>
                    <td>$999</td>
                </tr>
                <tr>
                    <td>Airpods Pro 2</td>
                    <td>₹24,900</td>
                    <td>$349</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3"><i>*All prices are subject to change without prior notice.</i></td>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
