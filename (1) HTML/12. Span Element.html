<!-- Span Element in HTML -->
<!--
Span element is also generic container used to hold other HTML lelements or group elements together.
It is an inline element.
-->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Span Element</title>
    </head>
    <body>
        <span>
            <a href="https://www.google.com">Google</a>
            <a href="https://www.netfix.com/in/">Netflix</a>
        </span>
        <a href="https://www.apnacollege.in/">Apna College</a>
    </body>
</html>
