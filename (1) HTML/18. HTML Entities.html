<!-- HTML Entities in HTML -->
<!--
An HTML entity is a piece of text ("string") That begins with an ampersand(&) and ends with a semicolon(;).
It is used to display reserved characters (which would otherwise be iinterpreted as HTML code), and invisible characters (like non breaking spaces).
It can be also use in place of characters that are difficult to type with a standard keyboard.
The browser interprets them & renders correct character.

Examples:
&nbsp;    Non-breaking spaces
&lt;      Less than
&gt;      Greater than
&amp;     Ampersand
&quot;    Double Quotes
&bigstar; Star symbol
&hearts;  Heart symbol

Note: Check more from MDN Web Docs.
-->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML Entities</title>
    </head>
    <body>
        <h1>&nbsp;    Non-breaking spaces</h1>
        <h1>&lt;      Less than</h1>
        <h1>&gt;      Greater than</h1>
        <h1>&amp;     Ampersand</h1>
        <h1>&quot;    Double Quotes</h1>
        <h1>&bigstar; Star symbol</h1>
        <h1>&hearts;  Heart symbol</h1>

        <h1>The sky is cloudy &#9729; &amp; it will rain &#9748; today.</h1>
    </body>
</html>
