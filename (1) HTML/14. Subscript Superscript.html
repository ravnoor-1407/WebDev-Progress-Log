<!-- Subscript & Superscript in HTML -->
<!--
Subscript defines text that should be displayed below the normal line of text. It is typically rendered in a smaller font size.
Primary Uses: Chemical formulas, mathematical bases, and variables.

Superscript defines text that should be displayed above the normal line of text. Like the subscript tag, it is rendered in a smaller font size.
Primary Uses: Mathematical exponents, ordinal numbers (like 1st, 2nd), and footnote citations.
-->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Subscript & Superscript</title>
    </head>
    <body>
        <h1>Chemistry Formulae:</h1>
        <h2>Water: H<sub>2</sub>O</h2>
        <h2>Glucose: C<sub>6</sub>H<sub>12</sub>O<sub>6</sub></h2>
        <h2>Carbon dioxide: CO<sub>2</sub></h2>

        <h1>Mathematical Formulae</h1>
        <h2>Pythagoras Theorem: H<sup>2</sup>= B<sup>2</sup>+ P<sup>2</sup></h2>
        <h2>Algebraic expression: (a+b)<sup>2</sup>= a<sup>2</sup> + 2ab + b<sup>2</sup></h2>
        <h2>Algebraic expression: (a-b)<sup>2</sup>= a<sup>2</sup> - 2ab + b<sup>2</sup></h2>
    </body>
</html>
