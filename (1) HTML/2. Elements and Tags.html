<!-- HTML Elements and Tags -->
<!--
HTML Elements are the building blocks of HTML pages. They are represented by tags, which are enclosed in angle brackets.
Tags are the components used to design the structure and content of websites.
Each element has a specific purpose and can contain attributes that provide additional information about the element.
Here are some common HTML elements and their corresponding tags:
HTML Element     HTML Tag
Heading          <h1> to <h6>
Paragraph        <p>
Link             <a> (Anchor Tag)
Image            <img>
List             <ul> (Unordered List) and <ol> (Ordered List)
List Item        <li>
Table            <table>
Table Row        <tr>
Table Data       <td>
Form             <form>
Input            <input>
Button           <button>
Content Division <div>
Span             <span>
These are just a few examples of HTML elements and their tags. There are many more elements available.
The whole tag structure consists of an opening tag, content, and a closing tag. For example:
<p>This is a paragraph.</p>
In this example, <p> is the opening tag, "This is a paragraph." is the content, and </p> is the closing tag.
Some tags are self-closing, meaning they do not require a closing tag. For example:
<img src="image.jpg" alt="Description of image">
In this case, <img> is a self-closing tag that includes attributes like src (source) and alt (alternative text).
-->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML Elements & Tags</title>
    </head>
    <body>
        <!-- Standard HTML Tags: Paragraph, Heading -->
        <h1>This is a Heading 1</h1>
        <p>This is a paragraph of text. It provides information about the content of the webpage.</p>
        <p>This is another paragraph, demonstrating the use of multiple paragraphs in HTML.</p>
    </body>
</html>
