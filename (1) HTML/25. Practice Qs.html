<!-- Practice Questions on Forms -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Practice Qs</title>
    </head>
    <body>
    <!-- Create a search option that redirects its search request to google -->
        <form action="https://www.google.com/search">
            <input type="text" name="q" placeholder="Search Google">
            <button type="submit">Search</button>
        </form>
        <br>
    <!-- Create a search option that redirects its search request to Wikipedia -->
        <form action="https://en.wikipedia.org/wiki/Special:Search">
            <input type="text" name="search" placeholder="Search Wikipedia">
            <button type="submit">Search</button>
        </form>
    </body>
</html>
