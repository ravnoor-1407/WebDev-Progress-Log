<!-- Attributes & Elements in HTML -->
<!--
Attributes are used to add more information to the tag.
Examples: <html lang="en"> <meta charset="UTF-8"> <ol type='A'>

Anchor tag is used to add links to your page.
In anchor tag, we can add two types of links i.e. absolute or relative links.
Example: <a href="https://google.com"> Google </a>

Image tag is used to add image to your page. It also doesn't require closing tag.
It also consists relative url using 'src' attribute and alternative text using 'alt' attribute to be displayed if page can't render image 
-->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Attributes and Elements</title>
    </head>
    <body>
        <a href="https://www.google.com">Visit Google</a>
        <img 
        src="https://static.vecteezy.com/system/resources/previews/021/515/072/non_2x/google-brand-logo-symbol-design-illustration-with-black-background-free-vector.jpg" 
        alt="Google"
        height="100px"
        width="200px">

        <br><br>
        
        <a href="https://www.netflix.com/in/">Visit Netflix India</a>
        <img 
        src="https://i.ytimg.com/vi/ZMak63mHq5Y/maxresdefault.jpg" 
        alt="Netflix"
        height="100px"
        width="200px">
    </body>
</html>
