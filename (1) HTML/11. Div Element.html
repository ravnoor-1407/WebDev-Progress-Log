<!-- Division Element in HTML -->
<!--
Content Division Element <div> is a container used to hold other HTML elements or group elements together.
It doen't have its own functionality(generic container), but acts as the container for other tags.
It is a block element.
-->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Div Element</title>
    </head>
    <body>
        <div>
            <a href="https://www.google.com">Google</a>
            <a href="https://www.netfix.com/in/">Netflix</a>
        </div>
        <a href="https://www.apnacollege.in/">Apna College</a>
    </body>
</html>
