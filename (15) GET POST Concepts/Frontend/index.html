<!--
GET and POST Requests Documentation

(a) GET Request: used to get some response from the server
Data is sent in the URL as query parameters, and it is visible to everyone. 
It is not secure for sensitive data.

(b) POST Request: used to submit data to the server (create, write, update, delete)
Data is sent via request body, and it is not visible in the URL. 
It is more secure for sensitive data.


Conventional use as good programmer:
GET for retrieving data, and POST for sending data to the server.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GET and POST Requests</title>
</head>
<body>
    <h3>GET Request Form</h3>
    <form method="GET" action="http://localhost:8080/register">
        <input placeholder="Enter username" name="username" type="text">
        <input placeholder="Enter password" name="password" type="password">
        <button type="submit">Submit </button>
    </form>

    <h3>POST Request Form</h3>
    <form method="POST" action="http://localhost:8080/register">
        <input placeholder="Enter username" name="username" type="text">
        <input placeholder="Enter password" name="password" type="password">
        <button type="submit">Submit </button>
    </form>
</body>
</html>
